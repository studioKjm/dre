name: Mutation testing

on:
  pull_request:
    branches: [master]
    paths:
      - "packages/core/src/**"
      - "stryker.config.json"
  schedule:
    # 매주 월요일 07:00 UTC — packages/core 변경이 없어도 주기적으로 재확인한다.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  mutation:
    name: Stryker (packages/core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
