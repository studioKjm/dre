fixes_applied_this_round:
  - "bot-challenge.ts: added /just a moment/i — Cloudflare's current interstitial title wasn't in BOT_CHALLENGE_PATTERNS, so a Cloudflare-protected page (medium.com) was silently
    reported as 'no price-like text found (page may be JS-rendered)' instead of the accurate
    'bot-challenge screen'. Confirmed live against medium.com/plans and help.medium.com (both 403
    with a 'Just a moment...' body)."
  - "pricing.ts: evidence snapshot used text.slice(0, 20000) unconditionally — on long
    marketing-heavy pages (stripe.com/pricing is ~40,000 chars of extracted text), the actual
    fee-schedule section can sit past char 20,000 and never make it into the evidence the
    calling agent sees. Verified live: stripe.com's 'Stripe Sigma'/'Billing' monthly-subscription
    pricing ($620/mo, explicitly labeled 'Subscription and cancellation terms apply') sat at
    char ~23,869, just past the old cutoff. Replaced the flat head-slice with snapshotWindow(),
    which centers the snapshot on the span where extractPlanCandidates actually found matches."
  - "pricing.ts: FREE regex only matched a line that was exactly 'free'/'무료'. On dropbox.com/plans,
    the Basic plan's name and price run together with no separator ('BasicFree') because
    htmlToText only breaks lines at block tags, and this specific card used inline elements.
    Added FREE_SUFFIX to catch a short line ending in '<lowercase-letter>free'. Verified live:
    dropbox.com/plans now yields {name: 'Basic', priceText: 'Free'}."
  - "regenerated 3 reports using the fixes above, with freshly collected evidence (not invented):
    stripe.com (added [subscription] from the Billing/$620-per-month text), dropbox.com (added
    [freemium] from the Basic/Free text), medium.com (added [freemium] as an inferred,
    source:agent claim — medium.com/plans and its help-center article are both genuinely
    Cloudflare-blocked right now, confirmed live, so this is the documented ADR-003 fallback,
    not something DRE itself could collect)."
