seed_ref: "seed-v1.yaml"
ac_ref: "AC-008"
status: "provisional, supersedes ac-008-provisional-2026-11-11c — first round to pass the 85% target"
mean_match: 0.874
pass_threshold: 0.85
fixes_applied_this_round:
  - "Three real collector robustness bugs found live-testing the weakest targets
    (canva/coupang/duolingo), not relabeling: (1) pricing's auto JS-render retry discarded an
    already-successful static fetch result on any non-BrowserUnavailable/AutomationBlocked
    error (e.g. a plain navigation timeout on duolingo.com) — now falls back to the static
    result with a warning instead of failing the whole collector. (2) techstack threw away a
    4xx/5xx response's headers before ever reading them, despite advertising header-only
    detection as immune to blocking — confirmed live on coupang.com's 403 (server: AkamaiGHost,
    a new signature added). (3) terms had no archive.org fallback at all (unlike pricing) for
    either the home page or candidate links, so coupang.com's 403 killed it outright — now
    mirrors pricing's fallback on the home page, and a blocked candidate link is skipped with a
    warning instead of discarding everything already found. See ADR-026/027/029 in docs/adr.yaml."
  - "After the fixes, re-ran the independent-labeler process itself: 3 separate subagents (one
    per target — canva/coupang/duolingo), each with explicit instructions NOT to read
    benchmarks/gold/, collected fresh evidence with the newly-fixed collectors and wrote their
    own labeled reports blind. This matters because the orchestrating session (this one) had
    already read the gold YAML for these 3 targets during live debugging — if it had relabeled
    them itself, the score would be contaminated (same trap as the grader/graded independence
    issue flagged in ADR-017). Delegating the actual labeling to agents with no gold access kept
    AC-008 an honest measurement."
  - "duolingo: 50% -> 100%. The labeling subagent found 'Duolingo English Test' reported as its
    own line in the 10-K revenue-disaggregation footnote, separate from Subscription — correctly
    read as a one-time-purchase product distinct from the subscription business, closing the
    missing freemium/one-time gap (freemium was inferred from Subscription+Advertising segments
    coexisting on a free consumer app, since the pricing page itself was still JS-blocked)."
  - "coupang: 40% -> 50%. Found 'marketplace-fee' evidence directly in the homepage's own text
    (coupang self-describes as a '통신판매중개자'/mail-order intermediary for third-party
    marketplace listings), corroborated by the 10-K's 'Third-party merchant services' segment.
    Still missing 'ads' (no confident evidence surfaced — Coupang's 10-K genuinely doesn't
    disaggregate an advertising line, consistent with the 2026-11-11 finding) and has an extra
    'one-time' label (first-party retail sales, which the labeler read as literal single-purchase
    transactions — arguably defensible, but not what the gold answer expects)."
  - "canva: 25% -> 40%. Found real evidence (Terms of Use text, App Store SKUs) for
    freemium/subscription/in-app-purchase/one-time, but canva.com's homepage/pricing now
    actively blocks automated browsers even via archive.org fallback, so 'marketplace-fee'
    (Creators Program) and 'enterprise-sales' (Contact Sales flow) evidence was unreachable —
    the labeler correctly declined to claim them without evidence rather than guessing."
  - "mean: 83.7% -> 87.4%. First round to clear the 85% pass threshold."
remaining_known_gaps: "coupang ads (no evidence in filings, as established 2026-11-11); coupang's extra one-time label (taxonomy judgment call, not a bug); canva marketplace-fee/enterprise-sales (bot-blocked, not a parsing gap); ridibooks/class101 (external sources, JS rendering, unchanged); figma usage-based (inconclusive, unchanged); spotify ads (20-F/IFRS gap, declined 2026-11-11 as not worth building for this one case)."
next_step: "85% target now passed (87.4%). Remaining gaps are each individually diagnosed rather than mysterious — most are either real-world blocking (canva, coupang's membership page) or genuine taxonomy ambiguity (coupang's one-time vs the gold's implicit scope), not DRE bugs. Real user feedback is the honest next lever rather than continuing to chase these last few points against a 20-target benchmark."
