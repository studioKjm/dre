decisions:
  - "새 독립 MCP 도구 collect_structured_data로 간다 — collect_techstack(기술스택)과 성격이 달라 합치지 않는다"
  - "스코프: schema.org Organization + Product/Offer 타입만. AggregateRating 등 다른 타입은 이번 라운드 제외"
  - "추출 필드는 화이트리스트 방식 — 스키마에 없는 필드는 무시, 전체 JSON 원문 통째 반환은 안 함"
  - "fetch는 독립 요청 (다른 수집기와 공유 안 함) — '각 수집기 독립 성공/실패' 기존 원칙 유지"
  - "봇 차단 시 archive.org 폴백 — pricing.ts/terms.ts와 같은 패턴 재사용"
  - "JSON-LD 블록 다수/파싱 실패는 best-effort — 하나 깨져도 나머지는 계속 시도"
  - "DRE는 라벨을 추론하지 않는다(ADR-003) — 추출된 필드는 raw evidence로만 반환, revenueModelLabels 매핑은 호출 에이전트 몫"
  - "analyze_company에 다섯 번째 호출로 포함시키는 건 이번 라운드 범위 밖 — 별도 작업으로 분리"
assumptions_surfaced:
  - "대부분 사이트는 schema.org JSON-LD가 아예 없을 수 있다 — '없음'이 정상적인 결과이지 에러가 아니다"
  - "JSON-LD는 페이지 소스에 이미 박혀 있는 정적 마크업이라 JS 렌더링(puppeteer) 불필요 — 정적 fetch만으로 충분"
  - "archive.org 스냅샷도 페이지 소스 자체를 보존하므로 JSON-LD가 대개 그대로 남아있다 (techstack의 '응답 헤더'와 달리 '본문 구조'라서 아카이브에도 유효)"
