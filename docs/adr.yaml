- id: ADR-002
  title: "수익모델 레이블 taxonomy를 코드로 고정하고 모호한 정의를 명확히 함"
  status: adopted
  date: 2026-10-25
  stacks: [nodejs, typescript]
  context: |
    2026-10-24~25 AC-008 평가에서, 같은 수집 증거를 보고도 라벨링 주체가 다르면(모델 자신 vs
    DRE 리포트를 보지 않은 독립 서브에이전트 2개) 결과가 크게 갈렸다 (88.7% -> 54.3%).
    원인을 분해해 보니 절반은 명백한 라벨링 누락(버그)이었지만, 나머지는 레이블 정의 자체가
    모호해서 생긴 불일치였다. 특히 Substack: "플랫폼이 구독료를 직접 받는가"와 "구독 기반
    비즈니스를 가능하게 하는가"가 구분되지 않아 한쪽은 subscription을 붙이고 한쪽은 뺐다.
    또한 revenueModelLabels는 Report 타입에서 그냥 string[]이라 오타나 taxonomy 밖 값이
    들어가도 컴파일/런타임 어느 쪽에서도 걸러지지 않았다.
  decision: |
    packages/core/src/labels.ts에 10개 레이블의 공식 정의를 단일 출처로 둔다.
    - subscription은 "분석 대상이 직접 고객에게 정기 결제를 청구"하는 경우로 한정하고,
      플랫폼이 제3자의 구독에서 수수료만 떼는 경우는 transaction-fee/marketplace-fee로 표현한다.
    - in-app-purchase는 핵심 수익모델이 아니라 "결제 채널" 보조 레이블로 명시하고, 비교 시
      핵심 레이블과 분리해서 보도록 문서화한다.
    Report.revenueModelLabels 타입을 RevenueModelLabel[]로 좁히고, validateReport가
    taxonomy 밖 문자열을 오류로 반환한다. MCP의 submit_report 입력 스키마도
    z.enum(REVENUE_MODEL_LABELS)로 맞춘다.
  consequence: |
    컴파일 타임에 DRE 내부 코드가 임의 라벨 문자열을 쓰는 것을 막는다. 외부 입력(MCP)은
    여전히 런타임 검증(validateReport)에 의존한다. 기존 reports/, benchmarks/gold/의
    Substack 라벨처럼 이 정의와 어긋나는 과거 라벨은 이 ADR 이후에만 적용되므로 소급해서
    자동으로 고쳐지지 않는다 — 재평가 시 수동으로 바로잡아야 한다.

- id: ADR-003
  title: "DRE 수집 실패 시 에이전트 보충 리서치를 공식 경로로 만들고 observed와 분리"
  status: adopted
  date: 2026-10-27
  stacks: [nodejs, typescript]
  context: |
    토스 경쟁사(카카오페이/네이버페이/카카오뱅크) 실사용 테스트에서 세 곳 모두 DRE 수집기가
    막혔다 (로그인 리다이렉트, robots.txt 전체 차단, 가격 정보 없는 JS 셸). 사용자가 직접
    일반 리서치로 보충해야 했는데, 이 과정이 "서비스가 아니라 숙제"라는 피드백을 받았다.
    그런데 seed-v1은 DRE가 LLM/웹검색을 직접 호출하지 않는다는 제약(non_goals)이 있어,
    DRE 자체에 리서치 기능을 넣을 수는 없다. 대신 "DRE가 막히면 호출하는 에이전트가
    보충 리서치를 하고, 그 결과를 DRE가 직접 관측한 것과 구분해서 리포트에 담는" 경로를
    정식 기능으로 만들기로 했다.
  decision: |
    Evidence에 source?: "dre" | "agent" 필드를 추가한다 (미지정 시 "dre"로 간주, 과거 리포트와 호환).
    collect_pricing/appstore/terms이 만드는 모든 근거는 source: "dre"로 자동 태깅한다.
    validateClaim은 observed 주장이 source:"agent" 근거에 의존하면 거부한다 — 에이전트가
    보충한 리서치는 inferred/estimated로만 표현할 수 있다. MCP 도구 설명에 이 정책을 명시해
    (수집이 막히면 우회하지 말고, 보충 리서치는 source:'agent'로 표시하라) 별도 학습 없이도
    호출하는 에이전트가 올바르게 쓰도록 했다.
  consequence: |
    DRE는 여전히 LLM/웹검색을 직접 호출하지 않는다 — 원칙 위반이 아니다.
    대신 리포트 하나에 "DRE가 직접 본 것"과 "에이전트가 보충한 것"이 투명하게 섞일 수 있다.
    대가는 과거 리포트(이번 ADR 이전)에는 source가 없어 전부 "dre"로 간주되는데, 실제로는
    AC-008 과정에서 Shopify/Steam처럼 일부는 사실상 에이전트(나 자신)의 보충 추론이 섞여
    있었다. 소급 정정하지 않았으므로 과거 리포트의 observed 표시는 완전히 신뢰할 수 없다.

- id: ADR-004
  title: "정규식 플랜 추출 대신 전체 텍스트를 에이전트에게 주고, 봇 차단 시 archive.org로 보충"
  status: adopted
  date: 2026-10-31
  stacks: [nodejs, typescript]
  context: |
    "REA만큼 매력적인 도구가 되어야 한다"는 요구를 받았다. 실제 사용에서 드러난 두 가지 문제:
    (1) PricingCollector의 정규식(extractPlanCandidates)이 Notion의 "per member/month"를
    플랜 이름으로 착각하고 Linear에서 CSS 조각을 가격으로 잘못 뽑는 등, 데이터가 있는데도
    DRE의 파싱이 서툴러서 놓치는 경우가 많았다. evidence.snapshot도 1000자로 잘려 있어 에이전트가
    직접 원문을 읽고 바로잡을 수조차 없었다.
    (2) 쿠팡(403), Cafe24(CAPTCHA), Canva(자동화 감지) 등 서버가 적극적으로 자동 요청을 막는
    대상은 DRE가 완전히 빈손으로 돌아왔다. REA는 로컬 바이너리를 분석해 대상이 저항하지 않지만,
    DRE는 실시간으로 방어하는 웹사이트를 상대해야 한다는 구조적 차이가 있다. 봇 탐지를 우회하는
    것은 기존 "약관 위반 스크래핑 금지" 원칙과 충돌해 선택지에서 제외했다.
  decision: |
    (1) PricingCollector의 evidence.snapshot을 "가격처럼 보이는 줄 요약(1000자)"에서
    "정제된 전체 페이지 텍스트(최대 20,000자)"로 바꾼다. extractPlanCandidates의 결과(items)는
    여전히 반환하지만 "빠른 힌트일 뿐 검증된 사실이 아니다"로 도구 설명에 명시한다. 가격·플랜
    해석의 최종 판단은 호출하는 에이전트(LLM)가 전체 텍스트를 읽고 내리도록 한다.
    (2) archive.org(Wayback Machine)를 봇 차단 전용 폴백으로 추가한다. 대상이 robots.txt로
    명시적으로 불허한 경우(RobotsDisallowed)에는 쓰지 않는다 — 그건 사이트의 명시적 의사이므로
    그대로 존중한다. 대신 robots.txt는 허용했는데 서버가 기술적으로 막은 경우(HTTP 403,
    AutomationBlocked, 200으로 받았지만 CAPTCHA 화면인 경우)에만 archive.org의 독립된
    스냅샷을 가져온다. archive.org/web.archive.org 모두 이 용도를 robots.txt로 막지 않음을
    확인했다(2026-10-31 기준). 원본 사이트에는 전혀 요청하지 않으므로 그 사이트의 차단을
    우회하는 것이 아니라, 애초에 다른 협조적인 소스를 쓰는 것이다.
  consequence: |
    Linear 같은 정상 SaaS 페이지에서 에이전트가 더 정확한 레이블을 낼 수 있게 됐다(증거 기반
    검증 완료). Cafe24 CAPTCHA 페이지에서도 실제 archive.org 스냅샷으로 진짜 페이지 콘텐츠를
    받아오는 것을 확인했다(2026-10-15 스냅샷). 대가: 아카이브 콘텐츠는 오래됐을 수 있고,
    에이전트가 evidence.url이 web.archive.org인지 꼭 확인해야 한다(경고에 명시). archive.org
    자체가 다운되거나 스냅샷이 없으면 폴백도 실패한다 — 이 경우 원래 오류를 그대로 던진다.
    appstore/terms 수집기에는 아직 archive 폴백을 연결하지 않았다(가장 문제가 컸던 pricing만
    먼저 적용).

- id: ADR-005
  title: "두 번째 수집기 확장: 기술스택 탐지(헤더/HTML)와 Google 광고 투명성 센터, Meta는 의도적으로 제외"
  status: adopted
  date: 2026-11-01
  stacks: [nodejs, typescript]
  context: |
    "REA 수준으로 유용해야 한다"는 요구(ADR-004)의 3단계. ADR-004에서 정규식 추출을
    전체 텍스트로 바꾸고 archive.org 폴백을 추가했지만, 그것만으로는 수집 "범위" 자체는
    넓어지지 않았다. REA가 넓어 보이는 이유 중 하나는 다루는 대상 종류가 많다는 점이다.
    서버가 구조적으로 막기 어려운 신호(응답 헤더, 공개 투명성 도구)부터 넓히기로 했다.
  decision: |
    (1) TechStackCollector + detectTechStack: 응답 헤더(server, x-powered-by, x-vercel-id 등)와
    HTML(프레임워크 마커, 결제/분석/CMS 스크립트 URL)에서 신호를 찾는다. 자체 정리한 작은
    서명 집합이며 Wappalyzer 같은 독점 DB를 쓰지 않는다. 결제 스크립트(js.stripe.com 등)
    탐지는 수익모델 추론의 보조 근거로도 쓸 수 있다. CAPTCHA 페이지에서는 그 페이지 자체의
    스택을 대상의 스택으로 오인하지 않도록 신호를 비워서 반환한다.
    (2) AdLibraryCollector: Google Ads Transparency Center(adstransparency.google.com)만
    다룬다. robots.txt가 존재하지 않아(404, 2026-11-01 확인) 제한이 없다. 숫자 파싱은
    "광고 약 N개"/"about N ads" 한 패턴만 가볍게 시도하고, 나머지는 전체 텍스트를 그대로
    준다(ADR-004와 같은 철학).
    (3) Meta 광고 라이브러리는 만들지 않는다. facebook.com/robots.txt가 "명시적 서면 허가
    없는 자동 수집은 금지"라고 명시하고, User-agent: ClaudeBot에 대해 Disallow: / (전체 차단)를
    별도로 지정하고 있다(2026-11-01 확인). 이건 일반적인 봇 차단 안내문이 아니라 Claude를
    이름으로 지목한 조항이라, DRE가 이 데이터를 수집하는 것은 적절하지 않다고 판단했다.
  consequence: |
    실사이트로 검증: TechStack은 Linear(Next.js+Cloudflare), Allbirds(Shopify+Cloudflare),
    stripe.com(Next.js), wordpress.org(WordPress) 모두 정확했다. AdLibrary는 notion.com에서
    "광고 약 200개"를 정확히 뽑았고, spotify.com처럼 패턴이 안 맞을 때도 숫자를 지어내지
    않고 경고와 함께 전체 텍스트를 넘겼다. MCP 도구가 4개에서 6개(collect_techstack,
    collect_ad_library 추가)로 늘었다. 대가: 기술스택 서명 집합이 작아 미탐지가 있을 수
    있고("없음"이 "그 기술을 안 쓴다"를 뜻하지 않음), 광고 데이터는 Google 생태계(검색/
    디스플레이/유튜브)만 보여주고 Meta·TikTok 등 다른 플랫폼 광고는 보지 못한다 — 이 공백은
    의도적이며, 봇 차단을 우회해서 메울 생각이 없다.

- id: ADR-006
  title: "가격 페이지 자동탐색 + analyze_company 통합 도구 (REA 수준 로드맵 1단계)"
  status: adopted
  date: 2026-11-06
  stacks: [nodejs, typescript]
  context: |
    "비용 없이 REA 수준으로" 검토(2026-11-05)에서 1순위로 꼽은 항목. 이번 세션 내내
    카카오페이·네이버페이·Cafe24·Linear를 분석할 때마다 가격 페이지의 정확한 서브 URL을
    먼저 검색해서 찾아야 했다. REA는 설치 한 줄로 끝나는데 DRE는 에이전트가 매번 사전 조사를
    해야 하는 마찰이 있었다.
  decision: |
    (1) PricingCollector.collect(url)가 홈 URL만 받아도 동작한다 — 받은 페이지에 가격
    후보가 0개이고 봇 차단도 아니면, TermsCollector와 같은 전략(같은 출처 우선, 없으면 다른
    출처도 허용)으로 "pricing/plans/요금제" 링크를 찾아 한 번 더 시도한다. 발견한 링크도
    robots.txt 검사를 그대로 받는다.
    (2) 새 CompanyAnalyzer(Logic)와 analyze_company(MCP 도구): 도메인 하나로 가격·약관·
    기술스택·광고를 한 번에 병렬 조회한다. 넷 중 하나가 막혀도(Promise.allSettled 방식으로)
    나머지를 가리지 않고 각자 {ok, result|error}로 독립 보고한다. 앱스토어는 도메인만으로
    URL을 추론할 수 없어 제외했다 — 필요하면 collect_appstore를 따로 쓴다.
  consequence: |
    실사이트 검증: notion.com, zoom.us 모두 홈 URL만 줬는데 자동으로 /pricing을 찾아 들어갔다
    (zoom은 리다이렉트 전후 출처가 달라 cross-origin 폴백이 실제로 쓰였다). linear.app을
    analyze_company 한 번으로 돌리니 가격 7건, 약관 7건, 기술스택 2건이 한 호출에 나왔다.
    대가: 가격 링크 탐색이 교차 출처까지 허용해, 페이지에 있는 아무 "pricing" 류 링크를
    실제로는 무관한 제3자 사이트로 오인해 따라갈 이론적 여지가 생겼다 — 발생 시 evidence.url로
    바로 드러나므로 치명적이지는 않다고 판단했다.

- id: ADR-007
  title: "SEC EDGAR 재무공시 연동 — 가격 페이지가 없는 회사도 수익 숫자를 얻는다"
  status: adopted
  date: 2026-11-06
  stacks: [nodejs, typescript]
  context: |
    "비용 없이 REA 수준으로" 로드맵 2순위. 토스 경쟁사(카카오페이·카카오뱅크) 분석이
    완전히 막혔던 근본 이유는 "가격 페이지 자체가 없는 회사"였다는 것이다. 그런데 미국
    상장사는 분기/연간 재무제표를 SEC에 의무 공시한다. SEC EDGAR(data.sec.gov,
    www.sec.gov)는 완전 무료고 키 발급도 필요 없다 — 다만 robots.txt가 막는 게 아니라
    "자신을 밝히라"는 공개 정책이 있다: User-Agent에 조직명과 연락처(이메일 형식)를 넣지
    않으면 403이 난다(2026-11-06 확인). 이건 봇 차단이 아니라 SEC가 명시한 공정이용
    요구사항이라, 형식을 맞추는 것이지 우회가 아니다.
  decision: |
    data/src/edgar.ts: company_tickers.json(티커→CIK 매핑, 매일 갱신되는 공개 정적 파일)과
    companyfacts API(XBRL 재무 데이터 전체)를 호출하는 순수 함수. logic/collectors/edgar.ts의
    EdgarCollector가 회사명/티커로 CIK를 찾고, 가장 최근 연간(10-K, FY) 매출·순이익을 뽑는다.
    매출 태그는 회계기준 변경으로 여러 개(Revenues, RevenueFromContractWithCustomer...)가
    쓰이므로 우선순위를 두고 첫 번째로 데이터가 있는 것만 쓴다. 상장사가 아니면(대부분의
    분석 대상이 그렇다) 오류가 아니라 빈 결과 + "비상장으로 보임" 경고를 낸다.
    User-Agent 기본값은 "DRE-open-source-tool contact@example.com"이고,
    DRE_SEC_USER_AGENT 환경변수로 사용자 본인 연락처로 바꿀 수 있다(바꾸는 것을 권장).
  consequence: |
    실사이트 검증: Airbnb(매출 $122.4억, 순이익 $25.1억, FY2025), Duolingo(매출 $10.4억,
    순이익 $4.1억, FY2025) 모두 정확히 나왔다 — 이 숫자들은 지난 AC-008 라운드에서
    에이전트들이 뉴스 기사로 추정해야 했던 바로 그 값들이고, 이제는 1차 공시 자료로
    직접 얻는다. Notion처럼 비상장사는 "SEC filer 없음"으로 정직하게 보고된다.
    MCP 도구가 7개에서 8개(collect_financials)로 늘었다. 대가: 미국 상장사와 (companyfacts
    API가 커버하는) 일부 대형 비상장 필러만 다루고, 카카오페이 같은 한국 회사는 여전히
    범위 밖이다 — DART 연동(3순위)이 그 공백을 메운다.

- id: ADR-008
  title: "DART(한국 금융감독원) 연동 — 키 발급은 사용자 몫, 코드는 미리 준비"
  status: adopted
  date: 2026-11-06
  stacks: [nodejs, typescript]
  context: |
    로드맵 3순위. ADR-007(EDGAR)과 같은 문제의 한국 버전 — 카카오페이·카카오뱅크처럼
    가격 페이지가 없는 회사의 수익 숫자를 1차 공시 자료로 얻는다. 다만 EDGAR와 달리
    DART Open API는 무료지만 opendart.fss.or.kr 회원가입과 키 발급이 필요하다. 계정 생성은
    대신 해줄 수 없다는 원칙에 따라, 이 세션에는 실제 키가 없어 라이브 검증을 하지 못했다.
    회사코드 매핑 파일이 ZIP(XML)으로 내려와 adm-zip(0.6.1, 순수 JS, 의존성 없음)을
    새로 추가했다 — 사용자 승인받음.
  decision: |
    data/src/dart.ts: corpCode.xml(ZIP)에서 회사명→corp_code 매핑을 읽고,
    fnlttSinglAcnt.json(reprt_code=11011, 사업보고서)으로 연간 재무제표를 가져온다.
    logic/collectors/dart.ts: DartCollector가 매출액/당기순이익 계정을 뽑는다.
    DART 미등록 회사(대부분)는 오류가 아니라 빈 결과+경고로 처리한다.
    API 키가 없으면 core의 새 ApiKeyMissing 오류로 구분해, "회사를 못 찾음"과
    "애초에 설정이 안 됨"을 서로 다른 경고 문구로 알린다. 키는 DRE_DART_API_KEY
    환경변수로 받는다.
  consequence: |
    키 없는 상태의 경로(가장 많이 쓰일 기본 상태)는 end-to-end로 확인했다 — "DART API key
    is not configured" 경고가 정확히 나온다. 하지만 엔드포인트 파라미터명·계정명
    표기(예: "당기순이익" vs "당기순이익(손실)")·오류 코드 체계는 공식 문서 기준으로
    작성했을 뿐 실제 키로 검증하지 못했다. 사용자가 키를 발급받아 DRE_DART_API_KEY에
    넣은 뒤 반드시 한 번 스모크 테스트가 필요하다 — EDGAR(ADR-007)처럼 "verified live"라고
    말할 수 없는 유일한 수집기다.

- id: ADR-009
  title: "archive.org CDX로 가격 변천사 추적 — REA에 없는 차별화 기능"
  status: adopted
  date: 2026-11-06
  stacks: [nodejs, typescript]
  context: |
    로드맵 4순위. 지금까지 archive.org는 "막혔을 때 1회성 폴백"으로만 썼다(ADR-004).
    그런데 CDX API(web.archive.org/cdx/search/cdx)를 쓰면 한 URL의 전체 저장 이력을
    타임라인으로 볼 수 있다. 이건 REA도 할 수 없는 일이다 — REA는 바이너리의 "지금 상태"만
    본다. "이 회사가 가격을 언제 얼마나 올렸는가" 같은 시계열 분석은 모방이 아니라
    새로운 능력이다.
  decision: |
    data/src/wayback.ts에 fetchWaybackTimeline(CDX 조회, collapse=timestamp:6으로
    근접 중복 제거)과 fetchWaybackSnapshot(스냅샷 하나를 id_ 접미사로 받아 아카이브
    자체 UI 배너 없이 원본 HTML만 받음) 추가. logic/collectors/price-history.ts의
    PriceHistoryCollector가 전체 타임라인에서 균등 간격으로 최대 N개(기본 6)를 뽑아
    각각 extractPlanCandidates(ADR-004에서 만든 그 함수 그대로 재사용)를 돌린다.
    새 MCP 도구: collect_price_history.
  consequence: |
    linear.app/pricing으로 실측: 2020-07의 Free/$8 2단 요금제가 2020-12에 $12 플랜이
    추가되며 3단 구조로 바뀐 게 그대로 드러났다 — 진짜 가격 인상/개편 이력이다. 대가:
    아카이브된 스냅샷은 그 시점의 정적 HTML이라, 그 페이지가 그 시점에 JS 렌더링이
    필요했다면 당시에도 셸만 저장돼 있어 모든 시점이 비어 나올 수 있다(오류는 아니고
    경고로 알린다). 이 숫자들은 inferred/추세용으로 쓰고 "그 날짜의 확정 가격"으로
    단정하지 말아야 한다 — 도구 설명에도 명시했다.

- id: ADR-010
  title: "채용공고(Greenhouse/Lever) 수집기 — 팀 규모·성장 단계의 간접 신호"
  status: adopted
  date: 2026-11-07
  stacks: [nodejs, typescript]
  context: |
    로드맵 5순위. 채용공고는 지원자가 봐야 하므로 사실상 차단되지 않는, 거의 유일한
    "회사 내부 정보" 소스다. Greenhouse(boards-api.greenhouse.io)와 Lever(api.lever.co)
    모두 공개 JSON API를 제공하고, robots.txt는 일부 경로만 막는다(2026-11-07 확인).
  decision: |
    data/src/jobboards.ts: fetchGreenhouseJobs/fetchLeverJobs가 각 공개 JSON API를
    호출한다. 둘 다 없거나 404면 오류가 아니라 null — 대부분의 회사는 둘 중 어느 것도
    안 쓴다. logic/collectors/jobs.ts의 JobBoardCollector가 두 소스를 합쳐 제목·지역·
    출처를 구조화하고, 미리보기는 30개로 자르되 items 전체는 그대로 둔다. 설명문 본문은
    가져오지 않는다 — ADR-004 원칙대로 가볍게 주고 필요하면 에이전트가 evidence URL로
    더 들어가게 한다. 새 MCP 도구: collect_jobs.
  consequence: |
    실사이트 검증: stripe(slug)에서 공고 768개 — 회사 규모를 보여주는 직접적인 신호다.
    notion(slug 추정)은 매치 없음으로 정직하게 보고됐다(Notion은 다른 ATS를 쓰는 것으로
    보인다). 대가: slug가 회사 도메인과 다른 경우가 많아(예: stripe.com ≠ slug
    "stripe") 에이전트가 slug를 추측하거나 검색해야 한다 — domain 자동 매핑은 하지 않았다.

- id: ADR-011
  title: "npm 배포 단위를 esbuild 번들 하나로 — 실제 publish는 보류"
  status: adopted
  date: 2026-11-07
  stacks: [nodejs, typescript]
  context: |
    로드맵 6순위, 마지막 단계. REA의 'npx rea-agents setup' 같은 설치 UX를 만들려 했다.
    그런데 DRE는 @dre/core·data·logic·app·mcp 5개 내부 패키지로 나뉜 모노레포라, 그대로
    publish하면 서로를 찾지 못한다. 또한 이 머신에 npm 로그인이 안 돼 있었고(npm whoami
    확인), 로그인/계정 생성은 대신 해줄 수 없다는 원칙이 있어 실제 publish는 사용자 몫으로
    남겼다.
  decision: |
    새 패키지 packages/dre-agents(공개명 "dre-agents", npm 확인 결과 미점유)를 만들고,
    esbuild(0.28.2, devDependency, 승인받음)로 내부 @dre/* 코드만 두 파일(dist/cli.js,
    dist/mcp-server.js)로 번들링한다. 서드파티 의존성(@modelcontextprotocol/sdk, zod, yaml,
    adm-zip)은 번들에 넣지 않고 dre-agents의 진짜 npm dependencies로 선언한다 — 처음에
    전부 번들링했더니 ESM 출력에서 CJS 패키지의 동적 require를 esbuild가 처리 못 해
    "Dynamic require of process is not supported" 오류가 났다(실제로 재현·확인). puppeteer-core는
    optionalDependencies로 — 자체 설치 스크립트가 있어 번들에 넣지 않는다.
    CLI의 `dre-agents setup`은 `claude mcp add`를 호출해 MCP 서버를 등록한다(--project로
    프로젝트 범위 선택 가능).
  consequence: |
    npm pack --dry-run으로 확인: 패키지 전체가 27KB(언팩 84KB), 파일 5개(cli.js, mcp-server.js,
    package.json, README, LICENSE)뿐이다. CLI 사용법 출력과 MCP 서버 기동("dre mcp server
    ready")을 로컬에서 실제로 확인했다. 대가: 실제 'npm publish'는 이 세션에서 하지 않았다 —
    사용자가 npm 계정으로 로그인한 뒤 packages/dre-agents에서 직접 실행해야 한다. 또한
    5개 내부 패키지가 바뀔 때마다 이 번들을 다시 만들어야 한다(자동 CI 연결은 안 했다).

- id: ADR-012
  title: "CI 파이프라인 — 7개 기본 게이트 + build/test를 GitHub Actions로"
  status: adopted
  date: 2026-11-09
  stacks: [nodejs, typescript]
  context: |
    REA와 비교 검토 결과, DRE에 CI/CD가 전혀 없다는 점이 가장 시급한 격차로 확인됐다.
    .harness/gates/에 7개 기본 게이트 스크립트(secrets/boundaries/structure/spec/layers/
    security/deps)가 이미 있었지만 로컬 pre-commit에서만 돌고 GitHub Actions 워크플로는
    없었다. check-deps.sh를 로컬 실행해보니 puppeteer-core(19.8.4-25.12.0 범위)의 전이
    의존성(basic-ftp/get-uri/pac-proxy-agent/proxy-agent/extract-zip) 때문에 high severity
    9건, body-parser DoS 1건이 잡혔다.
  decision: |
    puppeteer-core를 ^24.43.1 → ^25.16.0으로 올려(breaking 없음 — optionalDependency이고
    API 변경 없음) 9건을 해소, `npm audit fix`로 body-parser 1건 해소. 남은 1건(zod
    GHSA-mrhx-c7xc-m3w5, "<4.6.6")은 확인 결과 zod v4의 $ZodArray/handleArrayResult
    내부 구현에만 있는 버그인데 GHSA 메타데이터의 vulnerable_version_range가 메이저
    경계 없이 "<4.6.6"로만 기재돼 우리가 쓰는 zod v3.25.76(MCP SDK의 피어 의존성이라
    v4로 올리면 호환 깨짐)까지 잘못 포함한다 — 실제 취약 코드는 우리 트리에 없다.
    이 known false positive 때문에 deps 게이트 전체를 약화시키지 않으려 CI에서는
    `check-deps.sh --fail-on=critical`로 critical만 차단하고, high/moderate는 경고로
    남긴다(실제 critical이 생기면 여전히 막힌다). .github/workflows/ci.yml에 7개 게이트 +
    npm run build + npm test를 Node 20 매트릭스로 연결.
  consequence: |
    로컬에서 7개 게이트 전부 실행 확인(secrets/boundaries/structure/spec/layers 즉시 통과,
    deps는 위 조정 후 통과, security는 CI에서만 실행 — semgrep 설치가 필요해 로컬엔 없음).
    대가: zod 예외는 매 npm audit 실행마다 "1 high" 노이즈로 남는다 — zod가 실제로
    4.6.6 이상으로 올라가거나 MCP SDK가 zod v4를 지원하면 이 예외를 걷어내야 한다.

- id: ADR-013
  title: "setup을 멀티 에이전트로 확장 — Claude Code 외 Cursor/Gemini CLI 자동 등록"
  status: adopted
  date: 2026-11-09
  stacks: [nodejs, typescript]
  context: |
    REA 비교 검토에서 나온 두 번째 격차. REA의 setup은 Claude Code, Codex, Cursor,
    Gemini CLI, Grok Build를 전부 지원하는데 DRE는 Claude Code 하나뿐이었다. Codex의
    MCP 설정은 TOML(~/.codex/config.toml)이라 텍스트를 직접 조작하면 사용자의 기존
    설정을 깨뜨릴 위험이 있고, 전체 TOML 파서를 새 의존성으로 추가하려면 승인이
    필요해(CLAUDE.md "No new dependencies without approval") 이번 범위에서는 보류했다.
    Cursor와 Gemini CLI는 둘 다 JSON(`{"mcpServers": {...}}`)이라 node:fs만으로 안전하게
    머지할 수 있다.
  decision: |
    packages/dre-agents/src/cli.ts의 setup()을 에이전트 목록(claude/cursor/gemini)에 대해
    루프 돌게 바꿨다. 기본은 자동 감지(claude CLI 존재, ~/.cursor 또는 ~/.gemini 디렉토리
    존재) — 감지된 모두에 등록한다. `--agent=claude,cursor,gemini`나 `--agent=all`로 감지를
    건너뛰고 강제 지정할 수 있다. Cursor/Gemini는 writeJsonMcpConfig()로 기존 설정 파일을
    읽어 mcpServers.dre만 추가/갱신하고 다른 키(테마 등)는 그대로 둔다. 쓰기 전 원본을
    `<file>.bak`로 백업하고, JSON 파싱이 깨진 파일은 `<file>.bak-corrupt-<timestamp>`로
    백업한 뒤 빈 설정으로 새로 쓴다(사용자 설정을 말없이 덮어쓰지 않는다). 한 에이전트
    등록이 실패해도 나머지는 계속 진행하고 마지막에 ✓/✗ 요약을 보여준다.
  consequence: |
    임시 HOME으로 세 가지 시나리오를 로컬 검증: (1) ~/.cursor만 있는 상태에서
    --agent=cursor → mcp.json 생성 확인. (2) 기존 theme 키와 다른 mcpServer가 있는
    ~/.gemini/settings.json에 --agent=gemini → dre만 추가되고 theme·other 보존, .bak
    생성 확인. (3) --agent=foo(알 수 없는 값) → 에러로 즉시 거부. 대가: Codex(TOML)와
    Grok Build는 아직 미지원 — REA의 5개 에이전트 중 3개만 커버한다.

- id: ADR-014
  title: "Codex 지원 추가 — 범용 TOML 파서 없이 단일 테이블만 직접 쓰기"
  status: adopted
  date: 2026-11-10
  stacks: [nodejs, typescript]
  context: |
    ADR-013에서 Codex를 미룬 이유는 "TOML을 안전하게 다루려면 파서 의존성이 필요하고,
    그건 승인이 필요하다"였다. 그런데 실제로 필요한 작업은 범용 TOML 파싱이 아니라
    우리가 쓰는 `[mcp_servers.dre]` 테이블 하나를 찾아서 교체하거나 없으면 끝에
    덧붙이는 것뿐이다 — 이 좁은 작업은 의존성 없이도 안전하게 할 수 있다는 걸 재확인
    했다.
  decision: |
    cli.ts에 upsertTomlTable()을 추가했다: 파일을 줄 단위로 읽어 `[mcp_servers.dre]`
    줄을 찾고, 그 다음 `[`로 시작하는 줄(다음 테이블) 전까지를 "우리 블록"으로 보고
    통째로 교체한다. 없으면 파일 끝에 덧붙인다. 다른 테이블(`[mcp_servers.other]`,
    `[sandbox]` 등)과 최상위 키(`model = "o3"`)는 건드리지 않는다. 쓰기 전 `<file>.bak`
    백업은 Cursor/Gemini와 동일하게 적용. registerCodex()가 Cursor/Gemini와 같은
    writeJsonMcpConfig() 패턴으로 agents 목록에 추가됐다.
  consequence: |
    임시 HOME으로 3가지 검증: (1) config.toml이 전혀 없는 상태 → 새로 생성. (2) 생성한
    블록으로 재실행 → 중복 없이 같은 자리 교체(idempotent). (3) model/다른
    mcp_servers/sandbox 테이블이 이미 있는 파일 → 그대로 보존하고 dre 블록만 끝에
    추가. --agent=all로 claude+cursor+gemini+codex 4개 동시 등록도 확인. 대가: 우리
    테이블 뒤에 사용자가 직접 주석을 달아놨다면 "다음 `[` 전까지"로 보는 경계 판단이
    그 주석까지 같이 삼켜버릴 수 있다 — 흔한 경우는 아니라 받아들였다. Grok Build는
    여전히 미지원.

- id: ADR-015
  title: "Grok Build 지원 — Codex와 같은 TOML 형식이라 upsertTomlTable() 재사용"
  status: adopted
  date: 2026-11-10
  stacks: [nodejs, typescript]
  context: |
    docs.x.ai/build/features/mcp-servers 공식 문서를 확인한 결과, Grok Build의 MCP 설정도
    `[mcp_servers.<name>]` TOML 테이블(command/args/env, 또는 원격 서버면 url/headers)이고
    경로는 사용자 범위 `~/.grok/config.toml`, 프로젝트 범위 `.grok/config.toml`(git root까지
    올라가며 탐색, `grok mcp add --scope project`가 쓰는 파일)이다. 같은 이름의 프로젝트
    서버는 사용자 서버를 완전히 대체한다(병합이 아니라 교체) — 즉 ADR-014의
    upsertTomlTable()이 이미 정확히 이 동작(테이블 단위 전체 교체)을 하고 있어서 새로
    만들 게 없었다.
  decision: |
    registerGrok(scope)를 추가해 scope에 따라 `~/.grok/config.toml` 또는
    `<cwd>/.grok/config.toml`을 고르고, Codex와 동일한 upsertTomlTable()을 호출한다.
    agents 목록에 추가, --agent 목록/에러 메시지/사용법 출력에 grok을 반영. Grok Build는
    공식적으로 프로젝트 범위를 지원하므로 --project 플래그가 Claude Code/Cursor처럼
    적용된다(Codex·Gemini는 여전히 사용자 범위만).
  consequence: |
    임시 HOME/프로젝트 디렉터리로 검증: (1) 사용자 범위 신규 생성. (2) 프로젝트 범위에서
    기존 `[mcp_servers.other]`를 보존하며 dre 블록 추가. (3) --agent=all로 5개
    (claude/cursor/gemini/codex/grok) 동시 등록. REA가 지원하는 5개 에이전트를 전부
    커버하게 됐다. 대가: xAI 공식 문서를 기준으로 구현했지만 실제 Grok Build CLI로
    기동 테스트는 못 했다(설치돼 있지 않음) — 필드명(command/args/env)과 테이블 경로는
    문서에 명시된 그대로라 신뢰도가 높지만, 실사용 피드백이 들어오면 확인이 필요하다.

- id: ADR-016
  title: "dre-agents CLI에 자동 테스트 추가 — 매번 수동 스모크 테스트하던 걸 대체"
  status: adopted
  date: 2026-11-11
  stacks: [nodejs, typescript]
  context: |
    ADR-013/014/015 세 번의 agent 등록 로직 추가 모두 임시 HOME으로 손으로 스모크
    테스트를 했을 뿐, 테스트 스위트(147개)에는 cli.ts가 전혀 들어있지 않았다. 다른
    5개 패키지는 전부 테스트가 있는데 실제로 npm publish되는 패키지만 비어 있었다 —
    REA 비교 체크리스트에서 나온 격차 항목. 문제는 cli.ts가 모듈 최상단에서
    `process.argv`를 즉시 읽어 switch로 분기하고 실패 시 `process.exit()`를 불러서,
    import만 해도 부작용이 터진다는 점과, dre-agents가 tsc -b 프로젝트 레퍼런스에
    없어서(ADR-011 — esbuild로 직접 번들) 루트 `npm test`의 `find packages -path
    '*/dist/*' -name '*.test.js'` 글롭이 애초에 이 패키지를 보지 못한다는 점이었다.
  decision: |
    1) cli.ts의 최상위 switch를 main()으로 감싸고 `import.meta.url ===
    pathToFileURL(process.argv[1]).href`로 "직접 실행될 때만" 돌게 가드했다 — 테스트가
    모듈을 import해도 CLI가 실행되지 않는다. 2) setup()이 전역 `rest`를 읽던 걸
    `setup(args: string[])`로 바꿔 인자를 명시적으로 받게 했다. 3) 순수 로직
    (tomlValue, upsertTomlTable, writeJsonMcpConfig, selectAgents)을 export해서 직접
    단위 테스트할 수 있게 했다. selectAgents()는 "--agent 파싱 결과로 대상 agent
    목록을 좁히는" 필터링 로직을 agent 정의에서 떼어내 만든 새 함수다. 4) tsc
    프로젝트 레퍼런스에 묶지 않고, 이미 devDependency인 esbuild로 src/cli.ts와
    cli.test.ts를 번들 없이(no --bundle) dist-test/로 transpile한 뒤 `node --test`로
    돌리는 pretest/test 스크립트를 패키지에 추가했다(새 의존성 없음). 루트 CI에는
    `npm test -w dre-agents` 스텝을 별도로 추가했다 — 루트 `npm test`의 글롭과는
    분리된 경로다.
  consequence: |
    12개 테스트: tomlValue 렌더링 3종, upsertTomlTable의 신규 생성·기존 테이블 보존·
    idempotent 재실행·백업 4종, writeJsonMcpConfig의 신규 생성·키 보존·깨진 JSON
    격리 3종, selectAgents의 자동감지·all·명시목록·unknown-name 필터링 2종(4개 중
    일부는 사실상 같은 분기). 모두 임시 디렉터리에서 돌아 실제 홈 디렉터리를
    건드리지 않는다. 리팩터링 후 실제 CLI(`node dist/cli.js setup --agent=all`)가
    여전히 정상 동작하는지 재확인했다. 대가: execFileSync로 실제 바이너리(claude,
    gemini, codex, grok)를 호출하는 registerClaudeCode 등 5개 register 함수 자체는
    여전히 단위 테스트가 없다 — child_process 모킹 없이는 손으로 하는 스모크 테스트에
    의존한다.

- id: ADR-017
  title: "AC-008 집계에서 in-app-purchase(보조 레이블) 제외 — 71.5% -> 77.0%"
  status: adopted
  date: 2026-11-11
  stacks: [nodejs, typescript]
  context: |
    2026-10-25b 평가 레코드의 remaining_known_gaps에 "핵심 레이블만 비교하는 옵션을
    추가하는 것을 고려"라고 적어뒀는데 실제로 구현하지 않은 채 방치돼 있었다. 동시에
    core/labels.ts의 in-app-purchase 정의 자체가 "비교·집계 시 핵심 수익모델 레이블과
    분리해서 보는 것을 권장한다"고 이미 명시하고 있었다 — 즉 채점기(eval-service.ts)가
    자기 taxonomy 문서의 권고를 어기고 있던 상태였다.
  decision: |
    core/labels.ts에 `SECONDARY_LABELS = ["in-app-purchase"]`를 export하고,
    eval-service.ts의 evaluate()가 score(Jaccard)를 계산할 때는 이 레이블을 양쪽에서
    제외하되, missing/extra 표시는 전체 레이블 기준으로 그대로 둬서(필터링된 걸로
    바꾸지 않음) 정보 손실 없이 "집계는 핵심만, 화면은 전체"로 분리했다.
  consequence: |
    같은 reports/(2026-10-23~29에 생성됨)와 같은 gold/를 재채점만 했는데 71.5% ->
    77.0%로 올랐다 — 새 리포트를 만들거나 새로 라벨링하지 않고 순수 채점 버그를 고친
    결과라 신뢰도가 높다. 여전히 85% 미달. 남은 불일치(medium.com의 freemium, stripe.com의
    subscription 등)를 들여다봤는데, DRE의 evidence-strict 원칙(ADR-003 — 증거 없는 주장은
    하지 않음) 때문에 생긴 보수적 누락인지, 독립 라벨러가 일반 지식으로 과대추론한 것인지
    이 세션에서는 구분할 방법이 없었다 — 같은 모델 계열의 또 다른 서브에이전트를 더
    돌려도 같은 종류의 판단 차이가 반복될 뿐 새 신호를 주기 어렵다고 보고, 이번 라운드는
    여기서 멈췄다. 다음 단계는 2026-10-25b와 동일하게 실제 제3자 사용 피드백이다.

- id: ADR-018
  title: "레포 정비 — CONTRIBUTING/SECURITY 보강, CHANGELOG, examples/, release-please"
  status: adopted
  date: 2026-11-11
  stacks: [nodejs, typescript]
  context: |
    REA 비교에서 나온 마지막 체크리스트 항목. CONTRIBUTING.md는 4줄짜리 규칙 목록뿐이라
    개발 환경 설정법이 없었고, SECURITY.md는 "contact to be added before first release"로
    npm/GitHub 공개 이후에도 그대로 방치돼 있었다. CHANGELOG.md·examples/는 아예 없었다.
  decision: |
    CONTRIBUTING.md에 dev setup(npm install/build/test, dre-agents는 tsc -b 밖이라 별도
    빌드 필요 — ADR-011), PR 전 체크리스트(게이트, 레이어 경계, ADR 작성), 컬렉터 추가
    가이드를 추가. SECURITY.md는 실제 공개된 npm 유지보수자 이메일(hello@pysirlabs.com)로
    교체하고 scope(SSRF 가드, 공급망, config-writer)를 적었다. TRADEMARK.md의 "이름 사용
    가능 여부 확인 중" 문구도 이제 실제로 github.com/studioKjm/dre + npm dre-agents로
    공개됐으니 제거. 루트 CHANGELOG.md를 손으로 작성(태그된 릴리즈가 아직 없어 전부
    Unreleased). examples/README.md에 이 프로젝트 자체 개발 과정에서 나온 실제 리포트 2개를
    그대로 실었다 — Notion(golden path, evidence 포함 5개 레이블)과 Cafe24(CAPTCHA 차단을
    우회하지 않고 정직하게 보고한 경우). release-please-config.json/
    .release-please-manifest.json/.github/workflows/release.yml을 추가해 packages/dre-agents의
    버전·CHANGELOG를 conventional commit 기반으로 자동화할 준비를 했다.
  consequence: |
    gh api repos/studioKjm/dre/actions/permissions/workflow로 확인한 결과
    default_workflow_permissions가 "read"이고 PR 생성/승인 권한이 꺼져 있어, release-please
    워크플로는 지금 push해도 실제로 release PR을 못 연다 — "Settings → Actions → General →
    Workflow permissions"를 Read and write로 바꾸고 "Allow GitHub Actions to create and
    approve pull requests"를 켜야 작동한다. 이건 저장소 설정 변경이라 사용자 승인 없이
    직접 하지 않고 안내만 남겼다(레포 소유자가 아니면 못 바꾸는 설정이기도 하다). npm
    실제 publish는 여전히 수동(보안키 2FA, ADR-011) — release-please는 버전/CHANGELOG/태그만
    자동화하고 publish는 대신하지 않는다.

- id: ADR-019
  title: "AC-008 85% 재도전 — 라벨링 재시도 대신 실제 수집기 버그 3개 사냥"
  status: adopted
  date: 2026-11-11
  stacks: [nodejs, typescript]
  context: |
    ADR-017에서 "같은 모델 계열의 또 다른 서브에이전트를 더 돌려도 새 신호를 주기 어렵다"고
    결론 내렸었다. 사용자가 85% 재도전을 요청해서, 이번엔 라벨링을 다시 하는 대신 접근을
    바꿨다 — medium.com/stripe.com의 불일치가 "DRE가 증거를 놓쳤나, 독립 라벨러가 과대추론
    했나"였는데, 실제로 DRE의 실제 수집기(services.pricing.collect)를 지금 라이브 사이트에
    돌려서 직접 확인했다.
  decision: |
    세 가지 진짜 버그를 찾아 고쳤다. (1) bot-challenge.ts에 Cloudflare 현행 인터스티셜
    제목 "Just a moment..."가 패턴 목록에 없었다 — medium.com이 403으로 막혀 있는 걸
    "JS-rendered라 가격이 없다"로 잘못 보고하고 있었다(실측 확인). (2) pricing.ts의
    evidence snapshot이 `text.slice(0, 20000)`로 머리부터 자르는데, stripe.com/pricing은
    전체 텍스트가 ~40,000자라 실제 요금 섹션(Stripe Sigma/Billing, $620/월, "Subscription
    and cancellation terms apply")이 char 23,869 부근에 있어 통째로 잘렸다(실측 확인).
    extractPlanCandidates가 찾은 매칭 구간을 중심으로 창을 잡는 snapshotWindow()로 교체.
    (3) dropbox.com/plans는 "Basic"과 "Free"가 공백 없이 붙어 "BasicFree"가 되는 카드가
    있어(inline 요소라 htmlToText가 줄바꿈을 안 넣음) 기존 FREE 정규식(정확히 "free"만
    매칭)이 못 잡았다 — FREE_SUFFIX로 "소문자+free로 끝나는 짧은 줄"도 잡게 확장.
    세 사이트의 리포트를 고쳐진 수집기로 다시 수집한 증거로 재작성했고, medium.com은
    실제로 지금도 차단돼 있는 걸 재확인해서 ADR-003 fallback(inferred, source:agent)으로
    freemium을 보충했다.
  consequence: |
    71.5% -> 77.0%(ADR-017) -> 78.3%(stripe) -> 80.7%(medium) -> 82.4%(dropbox). 전부
    재라벨링이 아니라 각각 live 사이트에서 직접 재현·확인한 근거로 설명 가능하다.
    남은 격차를 더 파봤다: coupang/duolingo의 'ads'는 SEC XBRL에 AdvertisingExpense만
    있고(광고 "비용", 수익 아님) AdvertisingRevenue는 없다 — 실제 증거는 10-K 세그먼트
    주석의 차원(dimensional) XBRL 태깅에 있을 가능성이 높은데, EdgarCollector는 평면
    개념만 읽어 이번 범위 밖. ridibooks/class101은 gold evidence 자체가 DRE 설계상
    닿지 않는 외부 소스(뉴스 기사, 제3자 헬프센터)다. class101.net 자체 페이지는 JS
    렌더링이라 정적 수집으로 가격 텍스트 자체가 0개(실측 확인). canva는 여전히 의도적
    한계(ADR-004/005)로 25%, 평균을 가장 크게 끌어내린다. 85%까지 남은 ~2.6pp는 이제
    "다시 돌려보면" 식으로 줄일 수 있는 게 아니라 (a) canva는 원칙 문제, (b) 차원 XBRL
    파싱은 실제 범위가 큰 새 작업, (c) 외부 소스는 DRE의 설계 범위 밖이라는 세 가지로
    명확히 분류됐다.

- id: ADR-020
  title: "SEC 10-K 매출 분해 주석 파싱 — XBRL 파서 없이 R##.htm을 htmlToText로"
  status: adopted
  date: 2026-11-11
  stacks: [nodejs, typescript]
  context: |
    ADR-019에서 "coupang/duolingo의 'ads'는 10-K 세그먼트 주석의 차원(dimensional) XBRL
    태깅에 있을 가능성이 높은데, 평면 개념만 읽는 EdgarCollector로는 범위 밖"이라고 적어뒀다.
    실제로 SEC 공시의 "Disaggregation of Revenue" 같은 주석을 들여다보니, dimensional XBRL
    태그 자체를 파싱할 필요가 없었다 — SEC의 XBRL 뷰어가 그 주석을 이미 사람이 보는 일반
    HTML 표(R##.htm)로 렌더링해서 같은 공시 디렉터리에 공개해둔다. 우리가 이미 모든 곳에
    쓰는 htmlToText로 바로 읽을 수 있는 포맷이었다.
  decision: |
    packages/data/src/edgar.ts에 세 함수를 추가: fetchLatestTenK(최신 10-K accession 찾기,
    submissions API) -> fetchFilingReports/parseFilingSummary(그 공시의 FilingSummary.xml에서
    "disaggregation...revenue" 이름의 보고서 찾기) -> fetchRevenueSegments/
    parseRevenueSegments(그 R##.htm을 읽어 "세그먼트 이름 -> Disaggregation of Revenue
    [Line Items] -> 개념 이름 -> 숫자들" 반복 패턴만 파싱). "$ in Millions/Thousands" 머리말
    배율도 반영한다. 범용 XBRL/차원 파서가 아니라 이 한 가지 렌더링 패턴만 읽는다 — 새
    의존성 없음. EdgarCollector.collect()가 이 결과를 기존 FinancialFact 배열에 그대로
    추가한다(라벨 매핑은 하지 않는다 — "DRE는 수집만, 라벨링은 호출 에이전트" 원칙 그대로).
  consequence: |
    실제 10-K 두 개로 검증: Coupang은 Net retail sales/Third-party merchant services/Other
    revenue로만 쪼개져 있어 'Advertising' 항목이 없다(코드 문제가 아니라 그 회사가 실제로
    이렇게 공시하지 않는다). Duolingo는 'Advertising: \$79,725,000'가 깨끗하게 있어 리포트에
    추가, AC-008 82.4% -> 83.7%. Spotify도 확인해봤다 — 20-F(외국 민간 발행인) + IFRS
    taxonomy(us-gaap 아님, ifrs-full) + EUR 보고라 애초에 이 기능이 못 미치는 대상인데,
    실제 20-F 매출인정 주석을 봐도 Premium/Ad-Supported를 별도 항목으로 태깅하지 않아
    20-F/IFRS 지원을 추가해도 Spotify 건은 해결되지 않았을 것 — 확인 후 그 확장은
    하지 않기로 했다(검증되지 않은 효과를 위해 범위를 넓히지 않음).

- id: ADR-021
  title: "dre-agents의 register* 함수 5개 유닛테스트 — 마지막 수동-스모크-전용 로직 제거"
  status: adopted
  date: 2026-11-13
  stacks: [nodejs, typescript]
  context: |
    ADR-016에서 cli.ts를 테스트 가능하게 리팩터링했지만, 실제 바이너리/파일을 건드리는
    registerClaudeCode/Cursor/Gemini/Codex/Grok 5개는 "child_process 모킹 없이는 손으로
    하는 스모크 테스트에 의존한다"는 known gap으로 남겨뒀다. REA 비교 체크리스트의
    마지막 항목.
  decision: |
    registerClaudeCode(scope, exec = execFileSync)로 exec를 주입 가능하게 바꿔서(기본값은
    진짜 execFileSync라 런타임 동작은 그대로) 실제 claude CLI를 부르지 않고 호출 인자와
    에러 래핑을 검증할 수 있게 했다. 나머지 4개(Cursor/Gemini/Codex/Grok)는 이미
    writeJsonMcpConfig/upsertTomlTable(ADR-013/014에서 테스트됨)에 위임하는 얇은 래퍼라
    exec 같은 주입은 필요 없었다 — 대신 HOME과 cwd를 임시 디렉터리로 바꿔서(withTempHome/
    withTempCwd, 테스트 종료 시 항상 원복) 실제 사용자 홈을 건드리지 않고 scope별
    경로 선택(사용자 범위 vs 프로젝트 범위)이 맞는지 확인했다.
  consequence: |
    8개 테스트 추가(claude 2개, cursor/gemini/codex/grok 각 1~2개) — dre-agents 패키지
    테스트 12개 -> 20개. 리팩터링 후 실제 CLI(`node dist/cli.js setup --agent=all`)가
    5개 에이전트 전부 여전히 정상 등록하는지 재확인. 이제 dre-agents의 모든 공개 함수가
    자동 테스트로 커버된다 — 수동 스모크 테스트에만 의존하는 로직이 더 없다.

- id: ADR-022
  title: "정적 수집 0개 + 비차단이면 js 렌더링 자동 재시도 — class101류 SPA 폴백"
  status: adopted
  date: 2026-11-13
  stacks: [nodejs, typescript]
  context: |
    ADR-019에서 class101.net이 "JS 렌더링이라 정적 수집으로 가격 텍스트 자체가 0개"라고
    확인했지만, collect_pricing의 js=true는 호출하는 에이전트가 직접 켜야 하는 옵션이라
    에이전트가 그 사실을 모르면 그냥 빈 결과로 끝났다. PricingCollector는 이미 archive.org
    폴백·pricing-link 자동 탐색처럼 "한 번 더 시도해보고 안 되면 원래 결과" 패턴을 쓰고
    있어서, 같은 패턴을 js 렌더링에도 적용하면 됐다.
  decision: |
    collect()에서 (pricing-link 자동 탐색까지 끝낸 후) 가격 후보가 0개, 차단(challenge)도
    아니고, 호출자가 아직 js:true를 안 썼고, renderer가 주어져 있으면 — 같은 URL로 한 번
    더 fetchAndExtract(url, { js: true })를 시도한다. 성공하면(후보가 생기면) 그 결과로
    교체하고 경고를 남긴다. 실패해도(renderer가 없거나 BrowserUnavailable) 기존
    fetchAndExtract의 조용한 정적 폴백 로직이 그대로 동작해 추가 비용은 낭비성 재시도
    한 번뿐이다. 차단(bot-challenge) 페이지는 "JS가 필요해서 비어있는" 게 아니라
    "자동화를 막아서 비어있는" 거라 재시도 대상에서 제외한다(렌더링해도 같은 차단 페이지만
    또 볼 뿐이고, 자동화 우회 시도로 보일 수 있다 — ADR-004/005).
  consequence: |
    실제 class101.net으로 검증: 정적 수집 0개 -> pricing-link 자동 탐색으로
    '/ko?viewMode=svod'로 이동 -> 거기서도 0개 -> js 자동 재시도 -> 12개 후보(20만원,
    무료, 9만원 쿠폰팩 등) 성공. AC-008 점수는 변화 없음(class101의 기존 리포트가 이미
    collect 가능한 one-time/subscription을 다른 경로로 갖고 있었고, 남은 enterprise-sales는
    이 JS 렌더링으로도 못 찾음 — ADR-019의 "외부 소스" 결론 재확인). 가치는 수집기
    견고성이다: 에이전트가 js=true를 몰라도 SPA 사이트가 더 이상 자동으로 빈 결과를
    주지 않는다. 테스트 3개 추가(자동 재시도 성공/renderer 없을 때 미재시도/차단 페이지
    미재시도).

- id: ADR-023
  title: "CodeQL 도입 — grep 기반 check-security.sh 대신 진짜 데이터플로 분석"
  status: adopted
  date: 2026-11-13
  stacks: [nodejs, typescript]
  context: |
    check-security.sh는 grep 패턴 매칭이라 이미 두 번 false positive를 냈다(ADR-012에서
    기록: RegExp.exec()를 child_process.exec로, 테스트 헬퍼 allowAll을 Spring @PermitAll로
    오탐). CodeQL은 실제 데이터플로/오염(taint) 분석이라 다른 종류의 신호를 준다.
  decision: |
    .github/workflows/codeql.yml 추가(javascript-typescript, build-mode: none — JS/TS는
    컴파일 없이 소스만으로 분석됨). security-events: write 권한은 이 워크플로 자체의
    permissions 블록에서 주는 것이라 release-please(ADR-018)처럼 저장소 설정 변경이
    필요 없었다. v3로 처음 돌렸을 때 "2026년 12월 폐지 예정" 경고가 나와서 바로 v4로
    올렸다.
  consequence: |
    첫 실행에서 실제로 14건을 찾았다. 전부 확인·조치:
    (1) js/polynomial-redos 7건 — pricing.ts(PRICE, 이름 뒤 구분자 strip),
    edgar.ts(FilingSummary.xml 파싱 3곳), appstore.ts(script 태그 파싱), core/text.ts
    (태그·주석·script 제거 2곳) — DRE가 실제로 외부(공격 가능) HTML을 처리한다는 점에서
    전부 진짜였다. 닫는 태그가 없는 입력에서 무제한 수량자가 시작 위치마다 끝까지 훑고
    실패하길 반복해 O(n²)가 되는 패턴 — 모든 수량자를 합리적 상한으로 제한해서 고쳤다
    (진짜 태그/가격/XML 요소가 그보다 길 일이 없다). 고치는 과정에서 정규식 `{0,10_000}`처럼
    숫자 구분자 밑줄을 썼다가(JS 숫자 리터럴에서만 되고 정규식 수량자 문법에는 안 된다)
    6개 테스트가 실패했다 — 로컬 `npm test`가 커밋 전에 바로 잡아내서 그대로 나가지
    않았다(테스트 인프라가 실제로 작동한다는 증거). (2) js/incomplete-multi-character-
    sanitization 4건 — core/text.ts의 htmlToText가 태그를 지운 "뒤에" 엔티티를
    디코딩해서, `&lt;script&gt;`처럼 인코딩된 태그가 스트립을 통과한 뒤 디코딩으로
    되살아날 수 있었다. 디코딩 후 한 번 더 스트립하는 2차 패스를 추가해서 막았다 —
    디코딩된 "<"/">"가 진짜 수식 비교("5 < 10")인 드문 경우는 그 구간이 지워지는 대가를
    감수했다(태그 재구성을 막는 쪽이 더 안전). (3) js/incomplete-url-substring-
    sanitization 2건 — wayback.test.ts는 `.includes("web.archive.org")`를 호스트명
    정확 비교로 고쳤다. terms.test.ts는 확인해보니 Array.prototype.includes(문자열
    배열의 정확한 원소 일치)를 String.prototype.includes(부분 문자열 체크)로 오인한
    진짜 오탐이라, 코드를 바꾸지 않고 GitHub API로 "false positive"로 dismiss했다.

- id: ADR-024
  title: "incomplete-multi-character-sanitization 2건, 디코딩 후 '<' 제거로도 안 닫혀서 — 고정점 반복으로 해결"
  status: adopted
  date: 2026-11-13
  stacks: [nodejs, typescript]
  context: |
    ADR-023에서 "디코딩 후 남은 '<'를 전부 지운다"로 4건 중 2건은 닫혔는데, 나머지 2건은
    재스캔에서도 같은 줄(htmlToText의 withoutNoise 계산부)에서 계속 잡혔다. CodeQL의
    이 쿼리가 실제로 원하는 건 "<!--...-->"/"<script>...</script>" 제거 자체가 한 번의
    패스로 끝나면 안 된다는 것이었다 — 원본 입력이 "<scr<!---->ipt>"처럼 마커가 겹쳐
    있으면, 가운데 주석을 지우는 순간 양옆이 붙어 "<script>"가 그 자리에서 새로 만들어
    지고, 한 번만 지나가는 .replace()는 자기가 만든 새 매치를 다시 보지 않는다.
  decision: |
    replaceToFixedPoint(s, pattern, maxIterations=5) — 더 이상 안 바뀔 때까지(또는
    상한 5회까지) 같은 정규식을 반복 적용한다. htmlToText의 주석 제거와 script/style/
    noscript 제거 둘 다 이걸로 감쌌다. 겹친 마커("<scr<!---->ipt>")와 엔티티 인코딩
    (ADR-023의 경우) 둘 다 잡는 회귀 테스트 2개 추가.
  consequence: |
    gh api .../code-scanning/alerts로 재확인 — open 0건. 세 번의 커밋(ADR-023의 1차 수정
    → '<' 전부 제거로 좁히기 → 이번 고정점 반복)을 거쳐서야 닫혔다 — CodeQL이 원하는
    "완전한" 살균의 기준이 처음 추측(태그 단위 재검사)과도, 두 번째 추측(디코딩 후
    '<' 제거)과도 달랐고, 정확한 조건(같은 패턴을 자기 출력에 다시 돌려서 변화가
    없을 때까지)을 실제 재스캔으로 확인해가며 맞췄다 — CI에 붙은 자동 스캐너를 상대로
    "로그 보고 고치고 다시 push"를 반복하는 게 그 자체로 유효한 개발 루프였다.
