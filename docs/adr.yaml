- id: ADR-002
  title: "수익모델 레이블 taxonomy를 코드로 고정하고 모호한 정의를 명확히 함"
  status: adopted
  date: 2026-10-25
  stacks: [nodejs, typescript]
  context: |
    2026-10-24~25 AC-008 평가에서, 같은 수집 증거를 보고도 라벨링 주체가 다르면(모델 자신 vs
    DRE 리포트를 보지 않은 독립 서브에이전트 2개) 결과가 크게 갈렸다 (88.7% -> 54.3%).
    원인을 분해해 보니 절반은 명백한 라벨링 누락(버그)이었지만, 나머지는 레이블 정의 자체가
    모호해서 생긴 불일치였다. 특히 Substack: "플랫폼이 구독료를 직접 받는가"와 "구독 기반
    비즈니스를 가능하게 하는가"가 구분되지 않아 한쪽은 subscription을 붙이고 한쪽은 뺐다.
    또한 revenueModelLabels는 Report 타입에서 그냥 string[]이라 오타나 taxonomy 밖 값이
    들어가도 컴파일/런타임 어느 쪽에서도 걸러지지 않았다.
  decision: |
    packages/core/src/labels.ts에 10개 레이블의 공식 정의를 단일 출처로 둔다.
    - subscription은 "분석 대상이 직접 고객에게 정기 결제를 청구"하는 경우로 한정하고,
      플랫폼이 제3자의 구독에서 수수료만 떼는 경우는 transaction-fee/marketplace-fee로 표현한다.
    - in-app-purchase는 핵심 수익모델이 아니라 "결제 채널" 보조 레이블로 명시하고, 비교 시
      핵심 레이블과 분리해서 보도록 문서화한다.
    Report.revenueModelLabels 타입을 RevenueModelLabel[]로 좁히고, validateReport가
    taxonomy 밖 문자열을 오류로 반환한다. MCP의 submit_report 입력 스키마도
    z.enum(REVENUE_MODEL_LABELS)로 맞춘다.
  consequence: |
    컴파일 타임에 DRE 내부 코드가 임의 라벨 문자열을 쓰는 것을 막는다. 외부 입력(MCP)은
    여전히 런타임 검증(validateReport)에 의존한다. 기존 reports/, benchmarks/gold/의
    Substack 라벨처럼 이 정의와 어긋나는 과거 라벨은 이 ADR 이후에만 적용되므로 소급해서
    자동으로 고쳐지지 않는다 — 재평가 시 수동으로 바로잡아야 한다.

- id: ADR-003
  title: "DRE 수집 실패 시 에이전트 보충 리서치를 공식 경로로 만들고 observed와 분리"
  status: adopted
  date: 2026-10-27
  stacks: [nodejs, typescript]
  context: |
    토스 경쟁사(카카오페이/네이버페이/카카오뱅크) 실사용 테스트에서 세 곳 모두 DRE 수집기가
    막혔다 (로그인 리다이렉트, robots.txt 전체 차단, 가격 정보 없는 JS 셸). 사용자가 직접
    일반 리서치로 보충해야 했는데, 이 과정이 "서비스가 아니라 숙제"라는 피드백을 받았다.
    그런데 seed-v1은 DRE가 LLM/웹검색을 직접 호출하지 않는다는 제약(non_goals)이 있어,
    DRE 자체에 리서치 기능을 넣을 수는 없다. 대신 "DRE가 막히면 호출하는 에이전트가
    보충 리서치를 하고, 그 결과를 DRE가 직접 관측한 것과 구분해서 리포트에 담는" 경로를
    정식 기능으로 만들기로 했다.
  decision: |
    Evidence에 source?: "dre" | "agent" 필드를 추가한다 (미지정 시 "dre"로 간주, 과거 리포트와 호환).
    collect_pricing/appstore/terms이 만드는 모든 근거는 source: "dre"로 자동 태깅한다.
    validateClaim은 observed 주장이 source:"agent" 근거에 의존하면 거부한다 — 에이전트가
    보충한 리서치는 inferred/estimated로만 표현할 수 있다. MCP 도구 설명에 이 정책을 명시해
    (수집이 막히면 우회하지 말고, 보충 리서치는 source:'agent'로 표시하라) 별도 학습 없이도
    호출하는 에이전트가 올바르게 쓰도록 했다.
  consequence: |
    DRE는 여전히 LLM/웹검색을 직접 호출하지 않는다 — 원칙 위반이 아니다.
    대신 리포트 하나에 "DRE가 직접 본 것"과 "에이전트가 보충한 것"이 투명하게 섞일 수 있다.
    대가는 과거 리포트(이번 ADR 이전)에는 source가 없어 전부 "dre"로 간주되는데, 실제로는
    AC-008 과정에서 Shopify/Steam처럼 일부는 사실상 에이전트(나 자신)의 보충 추론이 섞여
    있었다. 소급 정정하지 않았으므로 과거 리포트의 observed 표시는 완전히 신뢰할 수 없다.

- id: ADR-004
  title: "정규식 플랜 추출 대신 전체 텍스트를 에이전트에게 주고, 봇 차단 시 archive.org로 보충"
  status: adopted
  date: 2026-10-31
  stacks: [nodejs, typescript]
  context: |
    "REA만큼 매력적인 도구가 되어야 한다"는 요구를 받았다. 실제 사용에서 드러난 두 가지 문제:
    (1) PricingCollector의 정규식(extractPlanCandidates)이 Notion의 "per member/month"를
    플랜 이름으로 착각하고 Linear에서 CSS 조각을 가격으로 잘못 뽑는 등, 데이터가 있는데도
    DRE의 파싱이 서툴러서 놓치는 경우가 많았다. evidence.snapshot도 1000자로 잘려 있어 에이전트가
    직접 원문을 읽고 바로잡을 수조차 없었다.
    (2) 쿠팡(403), Cafe24(CAPTCHA), Canva(자동화 감지) 등 서버가 적극적으로 자동 요청을 막는
    대상은 DRE가 완전히 빈손으로 돌아왔다. REA는 로컬 바이너리를 분석해 대상이 저항하지 않지만,
    DRE는 실시간으로 방어하는 웹사이트를 상대해야 한다는 구조적 차이가 있다. 봇 탐지를 우회하는
    것은 기존 "약관 위반 스크래핑 금지" 원칙과 충돌해 선택지에서 제외했다.
  decision: |
    (1) PricingCollector의 evidence.snapshot을 "가격처럼 보이는 줄 요약(1000자)"에서
    "정제된 전체 페이지 텍스트(최대 20,000자)"로 바꾼다. extractPlanCandidates의 결과(items)는
    여전히 반환하지만 "빠른 힌트일 뿐 검증된 사실이 아니다"로 도구 설명에 명시한다. 가격·플랜
    해석의 최종 판단은 호출하는 에이전트(LLM)가 전체 텍스트를 읽고 내리도록 한다.
    (2) archive.org(Wayback Machine)를 봇 차단 전용 폴백으로 추가한다. 대상이 robots.txt로
    명시적으로 불허한 경우(RobotsDisallowed)에는 쓰지 않는다 — 그건 사이트의 명시적 의사이므로
    그대로 존중한다. 대신 robots.txt는 허용했는데 서버가 기술적으로 막은 경우(HTTP 403,
    AutomationBlocked, 200으로 받았지만 CAPTCHA 화면인 경우)에만 archive.org의 독립된
    스냅샷을 가져온다. archive.org/web.archive.org 모두 이 용도를 robots.txt로 막지 않음을
    확인했다(2026-10-31 기준). 원본 사이트에는 전혀 요청하지 않으므로 그 사이트의 차단을
    우회하는 것이 아니라, 애초에 다른 협조적인 소스를 쓰는 것이다.
  consequence: |
    Linear 같은 정상 SaaS 페이지에서 에이전트가 더 정확한 레이블을 낼 수 있게 됐다(증거 기반
    검증 완료). Cafe24 CAPTCHA 페이지에서도 실제 archive.org 스냅샷으로 진짜 페이지 콘텐츠를
    받아오는 것을 확인했다(2026-10-15 스냅샷). 대가: 아카이브 콘텐츠는 오래됐을 수 있고,
    에이전트가 evidence.url이 web.archive.org인지 꼭 확인해야 한다(경고에 명시). archive.org
    자체가 다운되거나 스냅샷이 없으면 폴백도 실패한다 — 이 경우 원래 오류를 그대로 던진다.
    appstore/terms 수집기에는 아직 archive 폴백을 연결하지 않았다(가장 문제가 컸던 pricing만
    먼저 적용).

- id: ADR-005
  title: "두 번째 수집기 확장: 기술스택 탐지(헤더/HTML)와 Google 광고 투명성 센터, Meta는 의도적으로 제외"
  status: adopted
  date: 2026-11-01
  stacks: [nodejs, typescript]
  context: |
    "REA 수준으로 유용해야 한다"는 요구(ADR-004)의 3단계. ADR-004에서 정규식 추출을
    전체 텍스트로 바꾸고 archive.org 폴백을 추가했지만, 그것만으로는 수집 "범위" 자체는
    넓어지지 않았다. REA가 넓어 보이는 이유 중 하나는 다루는 대상 종류가 많다는 점이다.
    서버가 구조적으로 막기 어려운 신호(응답 헤더, 공개 투명성 도구)부터 넓히기로 했다.
  decision: |
    (1) TechStackCollector + detectTechStack: 응답 헤더(server, x-powered-by, x-vercel-id 등)와
    HTML(프레임워크 마커, 결제/분석/CMS 스크립트 URL)에서 신호를 찾는다. 자체 정리한 작은
    서명 집합이며 Wappalyzer 같은 독점 DB를 쓰지 않는다. 결제 스크립트(js.stripe.com 등)
    탐지는 수익모델 추론의 보조 근거로도 쓸 수 있다. CAPTCHA 페이지에서는 그 페이지 자체의
    스택을 대상의 스택으로 오인하지 않도록 신호를 비워서 반환한다.
    (2) AdLibraryCollector: Google Ads Transparency Center(adstransparency.google.com)만
    다룬다. robots.txt가 존재하지 않아(404, 2026-11-01 확인) 제한이 없다. 숫자 파싱은
    "광고 약 N개"/"about N ads" 한 패턴만 가볍게 시도하고, 나머지는 전체 텍스트를 그대로
    준다(ADR-004와 같은 철학).
    (3) Meta 광고 라이브러리는 만들지 않는다. facebook.com/robots.txt가 "명시적 서면 허가
    없는 자동 수집은 금지"라고 명시하고, User-agent: ClaudeBot에 대해 Disallow: / (전체 차단)를
    별도로 지정하고 있다(2026-11-01 확인). 이건 일반적인 봇 차단 안내문이 아니라 Claude를
    이름으로 지목한 조항이라, DRE가 이 데이터를 수집하는 것은 적절하지 않다고 판단했다.
  consequence: |
    실사이트로 검증: TechStack은 Linear(Next.js+Cloudflare), Allbirds(Shopify+Cloudflare),
    stripe.com(Next.js), wordpress.org(WordPress) 모두 정확했다. AdLibrary는 notion.com에서
    "광고 약 200개"를 정확히 뽑았고, spotify.com처럼 패턴이 안 맞을 때도 숫자를 지어내지
    않고 경고와 함께 전체 텍스트를 넘겼다. MCP 도구가 4개에서 6개(collect_techstack,
    collect_ad_library 추가)로 늘었다. 대가: 기술스택 서명 집합이 작아 미탐지가 있을 수
    있고("없음"이 "그 기술을 안 쓴다"를 뜻하지 않음), 광고 데이터는 Google 생태계(검색/
    디스플레이/유튜브)만 보여주고 Meta·TikTok 등 다른 플랫폼 광고는 보지 못한다 — 이 공백은
    의도적이며, 봇 차단을 우회해서 메울 생각이 없다.
