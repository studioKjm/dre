- id: ADR-002
  title: "수익모델 레이블 taxonomy를 코드로 고정하고 모호한 정의를 명확히 함"
  status: adopted
  date: 2026-10-25
  stacks: [nodejs, typescript]
  context: |
    2026-10-24~25 AC-008 평가에서, 같은 수집 증거를 보고도 라벨링 주체가 다르면(모델 자신 vs
    DRE 리포트를 보지 않은 독립 서브에이전트 2개) 결과가 크게 갈렸다 (88.7% -> 54.3%).
    원인을 분해해 보니 절반은 명백한 라벨링 누락(버그)이었지만, 나머지는 레이블 정의 자체가
    모호해서 생긴 불일치였다. 특히 Substack: "플랫폼이 구독료를 직접 받는가"와 "구독 기반
    비즈니스를 가능하게 하는가"가 구분되지 않아 한쪽은 subscription을 붙이고 한쪽은 뺐다.
    또한 revenueModelLabels는 Report 타입에서 그냥 string[]이라 오타나 taxonomy 밖 값이
    들어가도 컴파일/런타임 어느 쪽에서도 걸러지지 않았다.
  decision: |
    packages/core/src/labels.ts에 10개 레이블의 공식 정의를 단일 출처로 둔다.
    - subscription은 "분석 대상이 직접 고객에게 정기 결제를 청구"하는 경우로 한정하고,
      플랫폼이 제3자의 구독에서 수수료만 떼는 경우는 transaction-fee/marketplace-fee로 표현한다.
    - in-app-purchase는 핵심 수익모델이 아니라 "결제 채널" 보조 레이블로 명시하고, 비교 시
      핵심 레이블과 분리해서 보도록 문서화한다.
    Report.revenueModelLabels 타입을 RevenueModelLabel[]로 좁히고, validateReport가
    taxonomy 밖 문자열을 오류로 반환한다. MCP의 submit_report 입력 스키마도
    z.enum(REVENUE_MODEL_LABELS)로 맞춘다.
  consequence: |
    컴파일 타임에 DRE 내부 코드가 임의 라벨 문자열을 쓰는 것을 막는다. 외부 입력(MCP)은
    여전히 런타임 검증(validateReport)에 의존한다. 기존 reports/, benchmarks/gold/의
    Substack 라벨처럼 이 정의와 어긋나는 과거 라벨은 이 ADR 이후에만 적용되므로 소급해서
    자동으로 고쳐지지 않는다 — 재평가 시 수동으로 바로잡아야 한다.

- id: ADR-003
  title: "DRE 수집 실패 시 에이전트 보충 리서치를 공식 경로로 만들고 observed와 분리"
  status: adopted
  date: 2026-10-27
  stacks: [nodejs, typescript]
  context: |
    토스 경쟁사(카카오페이/네이버페이/카카오뱅크) 실사용 테스트에서 세 곳 모두 DRE 수집기가
    막혔다 (로그인 리다이렉트, robots.txt 전체 차단, 가격 정보 없는 JS 셸). 사용자가 직접
    일반 리서치로 보충해야 했는데, 이 과정이 "서비스가 아니라 숙제"라는 피드백을 받았다.
    그런데 seed-v1은 DRE가 LLM/웹검색을 직접 호출하지 않는다는 제약(non_goals)이 있어,
    DRE 자체에 리서치 기능을 넣을 수는 없다. 대신 "DRE가 막히면 호출하는 에이전트가
    보충 리서치를 하고, 그 결과를 DRE가 직접 관측한 것과 구분해서 리포트에 담는" 경로를
    정식 기능으로 만들기로 했다.
  decision: |
    Evidence에 source?: "dre" | "agent" 필드를 추가한다 (미지정 시 "dre"로 간주, 과거 리포트와 호환).
    collect_pricing/appstore/terms이 만드는 모든 근거는 source: "dre"로 자동 태깅한다.
    validateClaim은 observed 주장이 source:"agent" 근거에 의존하면 거부한다 — 에이전트가
    보충한 리서치는 inferred/estimated로만 표현할 수 있다. MCP 도구 설명에 이 정책을 명시해
    (수집이 막히면 우회하지 말고, 보충 리서치는 source:'agent'로 표시하라) 별도 학습 없이도
    호출하는 에이전트가 올바르게 쓰도록 했다.
  consequence: |
    DRE는 여전히 LLM/웹검색을 직접 호출하지 않는다 — 원칙 위반이 아니다.
    대신 리포트 하나에 "DRE가 직접 본 것"과 "에이전트가 보충한 것"이 투명하게 섞일 수 있다.
    대가는 과거 리포트(이번 ADR 이전)에는 source가 없어 전부 "dre"로 간주되는데, 실제로는
    AC-008 과정에서 Shopify/Steam처럼 일부는 사실상 에이전트(나 자신)의 보충 추론이 섞여
    있었다. 소급 정정하지 않았으므로 과거 리포트의 observed 표시는 완전히 신뢰할 수 없다.
